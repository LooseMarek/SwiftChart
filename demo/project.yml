name: SwiftChartDemo
options:
  bundleIdPrefix: com.marekloose
  deploymentTarget:
    iOS: "18.0"

packages:
  SwiftChart:
    path: ..

targets:
  SwiftChartDemo:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SwiftChart
        excludes:
          - Info.plist
    dependencies:
      - package: SwiftChart
        product: SwiftChart
    settings:
      base:
        SWIFT_VERSION: 5.0
        PRODUCT_BUNDLE_IDENTIFIER: com.marekloose.SwiftChartDemo
        DEVELOPMENT_TEAM: 9JVYUSJU3D
        INFOPLIST_FILE: "SwiftChart/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  SwiftChartDemo:
    build:
      targets:
        SwiftChartDemo: all
    run:
      config: Debug
    archive:
      config: Release
